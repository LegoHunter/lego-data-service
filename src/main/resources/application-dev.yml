spring:
  config:
    import: file:${import-path}/database-configuration.yml
  datasource:
    database-key-name: rasppi5-01-lego-dev
    hikari:
      # MySQL on rasppi5-01 runs on Eastern time. Run every session in UTC so CURRENT_TIMESTAMP
      # defaults, NOW() and TIMESTAMP columns agree with the UTC values the application writes.
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 10000
      idle-timeout: 30000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 10000
      auto-commit: false
      login-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 10
      validation-timeout: 10000
      pool-name: rasppi5-01-mysql-jdbc-pool

otel:
  resource:
    attributes:
      deployment.environment: dev

lego:
  environment:
    code: dev
    production: false
  marketplace-listing-drafts:
    non-prod-bricklink-stockroom-id: B
