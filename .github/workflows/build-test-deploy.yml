name: 'Build Test Deploy'
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop        # PR merged into develop → dev
      - main           # PR merged into main → prod
    types:
      - closed         # Only trigger after PR is closed (merged)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.buildah-build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Build and deploy Maven snapshot
        run: mvn --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        id: buildah-build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/lego-data-service
          tags: ${{ github.sha }} snapshot latest
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile

      - name: Push image to registry
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.buildah-build.outputs.image }}
          tags: ${{ steps.buildah-build.outputs.tags }}
          registry: quay.io/tvattima
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment overlay
        id: env
        run: |
          if [[ "${{ github.ref }}" == refs/heads/feature/* ]]; then
            echo "overlay=sandbox" >> $GITHUB_OUTPUT
            echo "namespace=services-sandbox" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.merged }}" == "true" && "${{ github.event.pull_request.base.ref }}" == "develop" ]]; then
            echo "overlay=dev" >> $GITHUB_OUTPUT
            echo "namespace=services-dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.merged }}" == "true" && "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            echo "overlay=prod" >> $GITHUB_OUTPUT
            echo "namespace=services-prod" >> $GITHUB_OUTPUT
          else
            echo "No deployment needed"
            exit 0
          fi

      - name: Deploy via kustomize
        run: |
          echo "Deploying overlay ${{ steps.env.outputs.overlay }} to namespace ${{ steps.env.outputs.namespace }}"
          kubectl apply -k kubernetes/overlays/${{ steps.env.outputs.overlay }} \
            -n ${{ steps.env.outputs.namespace }}

