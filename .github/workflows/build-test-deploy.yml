name: 'Build Test Deploy'
on:
  push:
    branches:
      - 'feature/**'
#  pull_request:
#    branches:
#      - develop
#      - master
#    types:
#      - closed

jobs:
  Feature-Branch-Maven-Deploy-Snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: mvn deploy
        run: mvn --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildah Build
        id: buildah-build
        uses: redhat-actions/buildah-build@v2
        with:
          image: lego-data-service
          tags: ${{ github.sha }} snapshot latest
          platforms: linux/arm64
          containerfiles: |
            ./kubernetes/Containerfile

      - name: Podman Push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.buildah-build.outputs.image }}
          tags: ${{ steps.buildah-build.outputs.tags }}
          registry: quay.io/tvattima
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-to-legohunter-io:
    needs: Feature-Branch-Maven-Deploy-Snapshot
    runs-on: [ arc-runner ]

    steps:
      - uses: actions/checkout@v4

      - name: Deploy on Kubernetes cluster
        run: |
          kubectl apply -f kubernetes/deployment.yml
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/lego-data-service-deployment -n services-sandbox --timeout=180s || true

