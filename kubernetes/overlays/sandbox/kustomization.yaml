apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: services-sandbox

resources:
  - ../../base
  - hpa.yaml

images:
  - name: quay.io/tvattima/lego-data-service
    newTag: snapshot

replicas:
  - name: lego-data-service-deployment
    count: 1

patches:
  # Strategic merge patches - just list the file names
  - deployment-env-patch.yaml
  - deployment-resources-patch.yaml

