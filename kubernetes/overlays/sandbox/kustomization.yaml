apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for this overlay
namespace: services-sandbox

# Base resources
resources:
  - ../../base
  - hpa.yaml

# Image tag injection
images:
  - name: quay.io/tvattima/lego-data-service
    newTag: snapshot

# Replica override
replicas:
  - name: lego-data-service-deployment
    count: 1

# File-based strategic merge patches
patches:
  - path: deployment-env-patch.yaml
  - path: deployment-resources-patch.yaml

