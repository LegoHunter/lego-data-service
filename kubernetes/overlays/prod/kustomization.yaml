apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for this overlay
namespace: services-prod

labels:
  - pairs:
      app.kubernetes.io/instance: prod

# Base resources (the base is written for SANDBOX; the patches below retarget it to PROD)
resources:
  - ../../base
  - default-headers.yaml

# Image tag injection
images:
  - name: quay.io/tvattima/lego-data-service
    newTag: snapshot

# Replica override
replicas:
  - name: lego-data-service
    count: 1

# Patches
patches:
  - path: deployment-env-patch.yaml
  - path: deployment-resources-patch.yaml
  # Pod instance label and the services-prod-external-secret mount
  - path: deployment-prod-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: lego-data-service
  # PROD hostname and TLS certificate
  - path: ingress-patch.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: lego-data-service
