apiVersion: apps/v1
kind: Deployment
metadata:
  name: lego-data-service-deployment
  labels:
    app: lego-data-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lego-data-service-deployment
  template:
    metadata:
      name: lego-data-service-deployment
      labels:
        app: lego-data-service-deployment
    spec:
      containers:
        - name: lego-data-service
          image: quay.io/tvattima/lego-data-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=75
                -XX:InitialRAMPercentage=50
                -XX:+UseContainerSupport
            - name: ABC
              value: "1234"
          volumeMounts:
            - name: bricklink
              mountPath: /etc/.credentials/bricklink
            - name: database
              mountPath: /etc/.credentials/database
      volumes:
        - name: bricklink
          projected:
            sources:
              - secret:
                  name: bricklink-client-api-keys-secret
                  items:
                    - key: bricklink-client-api-keys.yml
                      path: bricklink-client-api-keys.yml
              - secret:
                  name: bricklink-web-secret
                  items:
                    - key: bricklink-web.yml
                      path: bricklink-web.yml
        - name: database
          secret:
            secretName: database-configuration-secret
      restartPolicy: Always
