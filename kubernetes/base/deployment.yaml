apiVersion: apps/v1
kind: Deployment
metadata:
  name: lego-data-service
  labels:
    app: lego-data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lego-data-service
  template:
    metadata:
      name: lego-data-service
      labels:
        app: lego-data-service   # selector label (required)
        app.kubernetes.io/name: lego-data-service
        app.kubernetes.io/instance: sandbox
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: lego-platform
    spec:
      # HOMELAB-26 E8: never run as root; default seccomp filter; volumes group-owned by the app user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lego-data-service
          image: quay.io/tvattima/lego-data-service
          # HOMELAB-26 E8: no privilege escalation, no Linux capabilities, read-only image filesystem.
          # The only writable path is /tmp (volume "tmp" below).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP

#          startupProbe:
#            httpGet:
#              path: /actuator/health/liveness
#              port: 8080
#            failureThreshold: 60   # 60 × 5s = 300s max startup
#            periodSeconds: 5
#            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Xms1g
                -Xmx1g
                -XX:MaxDirectMemorySize=256m
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+UseContainerSupport
            - name: ABC
              value: "1234"
          volumeMounts:
            - name: services-sandbox-external-secret
              mountPath: /etc/.credentials
              readOnly: true
            # Must stay after the secret: the dev/prod overlays patch volumeMounts/0 and volumes/0.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: services-sandbox-external-secret
          secret:
            secretName: services-sandbox-external-secret
        # java.io.tmpdir: Tomcat work and multipart files, ImageIO stream caches (lego-imaging
        # ImageScalingService), image-hosting photo temp files, JVM hsperfdata.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      restartPolicy: Always
