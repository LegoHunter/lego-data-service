apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lego-data-service
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lego-data-service.sandbox.internal.legohunter.io`)
      kind: Rule
      services:
        - name: lego-data-service
          port: 8080
      middlewares:
        - name: default-headers
  tls:
    secretName: sandbox-internal-legohunter-io-tls
