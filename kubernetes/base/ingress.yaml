apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lego-data-service
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/name: lego-data-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: lego-platform
spec:
  entryPoints:
    - websecure
  routes:
    # Placeholders: every overlay sets its own host and certificate (HOMELAB-26 E6).
    - match: Host(`lego-data-service.set-by-overlay.invalid`)
      kind: Rule
      services:
        - name: lego-data-service
          port: 8080
      middlewares:
        - name: default-headers
  tls:
    secretName: set-by-overlay
